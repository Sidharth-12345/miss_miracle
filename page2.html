<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proposal - Page 2</title>

    <link rel="stylesheet" href="page2.css">
</head>

<body>

    <!-- ==============================
         MAIN PAGE
    =============================== -->

    <main class="page">

        <!-- Heading
             Replace ---- with your heading later
        -->
        <h1 class="main-heading">
            BEAUTY IN THE SHADOWS
        </h1>

        <p class="sub-heading">
            
        </p>


        <!-- ==============================
             DOOR CONTAINER
        =============================== -->

        <section class="door-area">

            <!-- Initial clickable box -->

            <div id="constructionBox" class="construction-box">

                <div class="corner corner-tl"></div>
                <div class="corner corner-tr"></div>
                <div class="corner corner-bl"></div>
                <div class="corner corner-br"></div>

                <div class="box-content">

                    <div class="box-icon">
                        ◈
                    </div>

                    <div class="box-title">
                        GRANT PERMISSION FOR USING PICTURES
                    </div>

                    <div class="box-text">
                        CLICK TO PERMIT
                    </div>

                </div>

            </div>


            <!-- ==============================
                 DOOR
            =============================== -->

            <div id="doorScene" class="door-scene">

                <!-- Door frame -->

                <div class="door-frame">

                    <!-- 3D side -->
                    <div class="door-side"></div>

                    <!-- Main wooden door -->
                    <div id="door" class="door">

                        <!-- Wood panels -->

                        <div class="wood-panel panel-top">
                            <div class="wood-grain"></div>
                        </div>

                        <div class="wood-panel panel-middle">
                            <div class="wood-grain"></div>
                        </div>

                        <div class="wood-panel panel-bottom">
                            <div class="wood-grain"></div>
                        </div>


                        <!-- Door handle area -->

                        <div class="door-handle">

                            <div id="lock" class="lock">

                                <div class="lock-body">
                                    <div class="keyhole"></div>
                                </div>

                                <div class="lock-shackle"></div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ==============================
                 LOCK MESSAGE
            =============================== -->

            <div id="lockMessage" class="lock-message">

                <span class="message-symbol">◆</span>

                CLICK THE LOCK TO OPEN THE DOOR

                <span class="message-symbol">◆</span>

            </div>


            <!-- ==============================
                 IMAGE DISPLAY
            =============================== -->

            <div id="memoryViewer" class="memory-viewer">

                <div class="memory-number" id="memoryNumber">
                </div>

                <div class="image-container">

                    <img
                        id="memoryImage"
                        src=""
                        alt="Memory"
                    >

                </div>

            </div>

        </section>

    </main>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="page22.js"></script>

</body>
</html>
